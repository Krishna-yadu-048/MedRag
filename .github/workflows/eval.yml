name: Evaluation

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  medrag-eval:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.16.2
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run unit tests
        run: uv run pytest tests
      # The Qdrant service starts empty; without this step the eval test skips itself
      # ("collection is not indexed yet") and the workflow passes without evaluating anything.
      - name: Build MedRAG index
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLAMA_CLOUD_API_KEY: ${{ secrets.LLAMA_CLOUD_API_KEY }}
          QDRANT_HOST: localhost
          QDRANT_PORT: "6333"
        run: |
          uv run python -m src.wait_for qdrant --host localhost --port 6333 --timeout 120
          uv run python -m src.cli index --project medrag
      - name: Run MedRAG eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLAMA_CLOUD_API_KEY: ${{ secrets.LLAMA_CLOUD_API_KEY }}
          QDRANT_HOST: localhost
          QDRANT_PORT: "6333"
        run: uv run pytest eval/medrag/test_medrag.py -s
